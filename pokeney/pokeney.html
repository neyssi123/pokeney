  <head>
    <link rel="stylesheet" href="diseño.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

  <body>
    <header>

      <div class="boton">

    <div id="contenido">
      <section id="geracao">
        <div id="pesquisa">
          <input
            type="text"
            id="campo-pesquisa"
            placeholder="Buscar Pokémon..."
          />
        </div>

        <div class="imagen-geracao">
          <img src="imagenes/pokeball.png" alt="error" />
          <button data-geracao="1"><h4>1°geração</h4></button>
        </div>

        <div class="imagen-geracao">
          <img src="imagenes/pokeball.png" alt="error" />

        </div>

        <div class="imagen-geracao">
          <img src="imagenes/pokeball.png" alt="error" />

        </div>

        <div class="imagen-geracao">
          <img src="imagenes/pokeball.png" alt="error" />

          <img src="imagenes/pokeball.png" alt="error" />

        <div class="imagen-geracao">
          <img src="imagenes/pokeball.png" alt="error" />

        </div>

        <div class="imagen-geracao">
          <img src="imagenes/pokeball.png" alt="error" />
          <button data-geracao="9"><h4>9°geração</h4></button>
        </div>
      </section>

      <section id="pokemons" aria-live="polite">
        <!-- Os cartões são criados dinamicamente pelo arquivo pokeney-filtro.js usando a PokéAPI. -->
      </section>
    </div>

    <script src="favoritos.js"></script>
    <script src="pokeney-filtro.js"></script>
    
    <footer>
