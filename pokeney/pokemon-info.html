<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Pokémon info</title>
    <link rel="stylesheet" href="diseño.css" />
    <link rel="stylesheet" href="diseño-info.css" />
  </head>
  <header>
    <h1>pokeney</h1>
    <div class="boton">
      <a href="pokeney.html"><h3>Início</h3></a>
      <a href="#"><h3>Pokémons</h3></a>
      <a href="#"><h3>Pokémons favoritos</h3></a>
      <a href="#"><h3>Competitivo</h3></a>
      <a href="#"><h3>items</h3></a>
      <a href="#"><h3>soporte</h3></a>
      <h1></h1>
    </div>
  </header>
  <body>
    <div id="pokemon-principal">
      <section id="pokemon-img">
        <div id="nome-pokemon">
          <div id="nome-shiny">
            <h3 id="nome"></h3>
            <h3>shiny</h3>
          </div>
          <h2 id="numero"></h2>
        </div>
        <div id="shiny-img">
          <img id="imagem" />
          <hr />
          <img id="shiny" />
        </div>
        <div id="tipos"></div>
      </section>

      <section id="evolucao">
        <div id="caixa-evolucao">
          <h3>Linha Evolutiva</h3>

          <div id="linha-evolutiva"></div>
        </div>
      </section>
    </div>

    <div id="informacoes-pokemon">
      <div id="coluna-esquerda">
        <section id="detalles-pokemon">
          <div id="caixa-destaque">
            <h3>descrição</h3>
            <p id="descrição"></p>
          </div>
        </section>

        <section id="ficha">
          <div id="caixa-destaque">
            <h3>Ficha Tecnica Rapida</h3>

            <div id="ficha-img">
              <div class="ficha-item">
                <img src="imagenes/regra.png" alt="error" />
                <p>altura</p>
                <div id="altura"></div>
              </div>

              <div class="ficha-item">
                <img src="imagenes/peso.png" alt="error" />
                <p>peso</p>
                <div id="peso"></div>
              </div>

              <div class="ficha-item">
                <img src="imagenes/estrela.png" alt="error" />
                <p>habilidade</p>
                <div id="habilidade"></div>
              </div>

              <div class="ficha-item">
                <img src="imagenes/localizacao.png" alt="error" />
                <p>Região</p>
                <div id="localizacao"></div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div id="coluna-direita">
        <section id="bloco-fraquezas">
          <div id="caixa-destaque">
            <h3>fraquezas</h3>

            <div id="fraquezas"></div>
          </div>
        </section>

        <section id="bloco-stats">
          <div id="caixa-stats">
            <h3>Estatísticas Base</h3>

            <div class="stat">
              <span class="stat-nome">HP</span>
              <span id="stat-hp">0</span>

              <div class="barra">
                <div class="barra-preenchida" id="barra-hp"></div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-nome">Ataque</span>
              <span id="stat-ataque">0</span>

              <div class="barra">
                <div class="barra-preenchida" id="barra-ataque"></div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-nome">Defesa</span>
              <span id="stat-defesa">0</span>

              <div class="barra">
                <div class="barra-preenchida" id="barra-defesa"></div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-nome">Ataque Esp.</span>
              <span id="stat-ataque-esp">0</span>

              <div class="barra">
                <div class="barra-preenchida" id="barra-ataque-esp"></div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-nome">Defesa Esp.</span>
              <span id="stat-defesa-esp">0</span>

              <div class="barra">
                <div class="barra-preenchida" id="barra-defesa-esp"></div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-nome">Velocidade</span>
              <span id="stat-velocidade">0</span>

              <div class="barra">
                <div class="barra-preenchida" id="barra-velocidade"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="pokemones.js"></script>
    <script src="pokeney-busca.js"></script>
  </body>
</html>
