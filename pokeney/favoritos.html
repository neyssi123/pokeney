<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokeney - Favoritos</title>
  <link rel="stylesheet" href="diseño.css">
  <style>
  body{
    background: linear-gradient(180deg,#0B1D4A,#1E3A8A,#0EA5E9) !important;
    margin:0;
  }
  main h1, #status{ color:white !important; text-align:center; }
  #favoritos-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:18px; max-width:900px; margin:20px auto; padding:0 15px;
  }
  .item-card{
    background:white !important; border-radius:20px; text-align:center;
    padding:20px 10px; border-top:6px solid #FFCB05;
    box-shadow:0 10px 25px rgba(0,0,0,.35); transition:.2s;
  }
  .item-card:hover{ transform:translateY(-8px) scale(1.03); }
  .item-card img{
    width:110px; height:110px; background:#F1F5F9;
    border-radius:50%; padding:10px;
  }
  .item-card h3{ color:#1E3A8A; text-transform:capitalize; }
  @media(max-width:700px){
    #favoritos-grid{ grid-template-columns:repeat(2,1fr); gap:12px; }
  }
</style>

</head>
<body>
<header>
    <h1>pokeney</h1>
    <div class="boton">
        <a href="index.html"><h3>Início</h3></a>
        <a href="pokeney.html"><h3>Pokémons</h3></a>
        <a href="favoritos.html"><h3>Pokémons favoritos</h3></a>
        <a href="competitvo.html"><h3>Competitivo</h3></a>
        <a href="itens.html"><h3>Itens</h3></a>
    </div>
</header>


  <main>
    <h1>Seus Favoritos</h1> 
    <div id="status">Carregando...</div>
    <div id="favoritos-grid" class="grid"></div>
  </main>

  <script src="favoritos.js"></script>
  <script>
    const gridFav = document.getElementById('favoritos-grid')
    const statusFav = document.getElementById('status')

    async function carregarFavoritos(){
      const favs = getFavoritos()
      
      if(favs.length === 0){
        statusFav.textContent = 'Você ainda não favoritou nada. Clica na ☆ dos Pokémons!'
        return
      }

      statusFav.textContent = ''
      gridFav.innerHTML = ''

      for(const id of favs){
        try{
          const res = await fetch(`https://pokeapi.co/api/v2/item/${id}`)
          if(res.ok){
            const d = await res.json()
            gridFav.innerHTML += `
              <div class="item-card">
                <span class="estrela ativo" onclick="toggleFavorito('${d.name}', this); this.parentElement.remove(); checaVazio()">★</span>
                <img src="${d.sprites.default}">
                <h3>${d.name.replace(/-/g, ' ')}</h3>
                <p>${d.cost} ₽</p>
              </div>
            `
          } else {
            // se não for item, tenta como pokemon
            const resPoke = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`)
            const p = await resPoke.json()
            gridFav.innerHTML += `
              <div class="item-card">
                <span class="estrela ativo" onclick="toggleFavorito('${p.name}', this); this.parentElement.remove(); checaVazio()">★</span>
                <img src="${p.sprites.front_default}">
                <h3>${p.name}</h3>
              </div>
            `
          }
        }catch(e){}
      }
    }

    function checaVazio(){
      if(getFavoritos().length === 0){
        statusFav.textContent = 'Você ainda não favoritou nada. Clica na ☆ dos Pokémons!'
      }
    }

    carregarFavoritos()
  </script>
  <footer>
      <h3>pokeney</h3>
      <p>Wiki Pokémon feita para fins educativos.</p>
      <p>© 2026 pokeney</p>
    </footer>
</body>
</html>
